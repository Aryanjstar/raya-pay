services:
  postgres:
    image: postgres:16-alpine
    container_name: raya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: raya
      POSTGRES_PASSWORD: raya
      POSTGRES_DB: raya
    ports:
      - "5432:5432"
    volumes:
      - raya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raya -d raya"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  raya_pgdata:
